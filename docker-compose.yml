version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pull the model on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen3:4b && wait"]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - news_data:/data
    environment:
      - DB_PATH=/data/news.db
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen3:4b
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  news_data:
  ollama_data:
