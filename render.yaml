services:
  - type: web
    name: news-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false        # Neon PostgreSQL connection string — REQUIRED
      - key: INGEST_API_KEY
        sync: false        # Protects POST /ingest — REQUIRED in production
      - key: OPENROUTER_API_KEY
        sync: false        # OPTIONAL — free models at openrouter.ai
      - key: GEMINI_API_KEY
        sync: false        # OPTIONAL — free tier at aistudio.google.com
      - key: FRONTEND_URL
        sync: false        # Set after Vercel deploy — restricts CORS to your frontend origin
                           # e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: "3.11"
