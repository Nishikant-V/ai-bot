services:
  - type: web
    name: news-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false        # Set manually — Neon connection string (REQUIRED)
      - key: INGEST_API_KEY
        sync: false        # Set manually — your chosen secret string (REQUIRED)
      - key: OPENROUTER_API_KEY
        sync: false        # OPTIONAL — free models at openrouter.ai
      - key: GEMINI_API_KEY
        sync: false        # OPTIONAL — free tier at aistudio.google.com
      - key: PYTHON_VERSION
        value: "3.11"
