services:
  - type: web
    name: news-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false        # Set manually in Render dashboard — Neon connection string
      - key: GROQ_API_KEY
        sync: false        # Set manually in Render dashboard — from console.groq.com
      - key: INGEST_API_KEY
        sync: false        # Set manually in Render dashboard — your chosen secret string
      - key: PYTHON_VERSION
        value: "3.11"
